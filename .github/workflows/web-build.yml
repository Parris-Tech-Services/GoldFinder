name: Web build and browser smoke
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx expo export --platform web --output-dir dist
        env:
          CI: '1'
      - run: npx playwright install --with-deps chromium
      - name: Play exported web build on desktop and phone emulation
        run: |
          python3 -m http.server 8766 --directory dist > /tmp/goldfinder-http.log 2>&1 &
          trap 'kill $!' EXIT
          for attempt in $(seq 1 20); do curl -fsS http://127.0.0.1:8766/ > /dev/null && break; sleep 1; done
          node tests/web-smoke.mjs
          node tests/web-smoke.mjs --no-webgl
